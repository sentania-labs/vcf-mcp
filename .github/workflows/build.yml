name: Build

on:
  push:
    branches: [ "main", "round/*" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  test:
    name: CI Pipeline
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) # fork-gated
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        env:
          # setup-python bootstraps pip while installing an uncached patch
          # release. The lab runners can have slow paths to files.pythonhosted.org.
          PIP_DEFAULT_TIMEOUT: "300"
        with:
          python-version: "3.12"
          # Do not enable setup-python's pip cache on this heterogeneous
          # lab pool. Some runners have an unwritable inherited pip
          # cache directory, and setup-python turns that optional accelerator
          # into a hard failure before dependency installation begins.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Tier 1 and 2 Tests
        # These tests include fixture safety/freshness and exact skills-index
        # regeneration checks. The live tier remains explicitly opt-in.
        run: python -m pytest tests/

  build:
    name: Build and Push
    needs: test
    runs-on: lab
    if: github.event_name == 'push' && github.repository == 'sentania-labs/vcf-mcp'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          push: true
          tags: ghcr.io/sentania-labs/vcf-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
