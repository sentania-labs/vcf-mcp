name: Build

on:
  push:
    branches: [ "main", "round/*" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  test:
    name: CI Pipeline
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) # fork-gated
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        env:
          # setup-python bootstraps pip while installing an uncached patch
          # release. The lab runners can have slow paths to files.pythonhosted.org.
          PIP_DEFAULT_TIMEOUT: "300"
        with:
          python-version: "3.12"
          # Do not enable setup-python's pip cache on this heterogeneous
          # lab pool. Some runners have an unwritable inherited pip
          # cache directory, and setup-python turns that optional accelerator
          # into a hard failure before dependency installation begins.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Tier 1 and 2 Tests
        # These tests include fixture safety/freshness and exact skills-index
        # regeneration checks. The live tier remains explicitly opt-in.
        run: python -m pytest tests/

  build:
    name: Build and Push
    needs: test
    runs-on: lab
    if: github.event_name == 'push' && github.repository == 'sentania-labs/vcf-mcp'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/sentania-labs/vcf-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
