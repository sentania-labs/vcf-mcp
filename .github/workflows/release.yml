name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  test:
    name: Release gate
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Tier 1 and 2 Tests
        run: python -m pytest tests/

  publish:
    name: Publish product image
    needs: test
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sentania-labs/vcf-mcp:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  verify:
    name: Verify public image
    needs: publish
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # Operators pull this product without registry credentials. GHCR may
      # create a package as private on first publish, so public visibility is
      # a release gate rather than a manual follow-up.
      - name: Publish and verify public package visibility
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN || github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          encoded="${package//\//%2F}"
          base="/orgs/$owner/packages/container/$encoded"
          if ! gh api --method PATCH "$base/visibility" -f visibility=public >/dev/null 2>&1; then
            echo "Could not set package visibility through the API; verifying current state instead."
          fi
          visibility="$(gh api "$base" --jq .visibility 2>/dev/null || echo unknown)"
          if [ "$visibility" != public ]; then
            echo "ERROR: GHCR package $package is '$visibility', not public." >&2
            echo "Add a GHCR_VISIBILITY_TOKEN secret with admin:packages if the repository token cannot change it." >&2
            exit 1
          fi

      - name: Prove a credential-free pull works
        run: |
          image="ghcr.io/sentania-labs/vcf-mcp:$GITHUB_REF_NAME"
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/anonymous-docker.XXXXXX")"
          DOCKER_CONFIG="$anonymous_config" docker pull "$image"

  release:
    name: Create GitHub release
    needs: verify
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
