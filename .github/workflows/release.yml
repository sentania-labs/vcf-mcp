name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  test:
    name: Release gate
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Tier 1 and 2 Tests
        run: python -m pytest tests/

  publish:
    name: Publish product image
    needs: test
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          push: true
          tags: ghcr.io/sentania-labs/vcf-mcp:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  verify:
    name: Verify public image
    needs: publish
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # Operators pull this product without registry credentials. GHCR may
      # create a package as private on first publish, so public visibility is
      # a release gate rather than a manual follow-up.
      - name: Publish and verify public package visibility
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN || github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          encoded="${package//\//%2F}"
          base="/orgs/$owner/packages/container/$encoded"
          if ! gh api --method PATCH "$base/visibility" -f visibility=public >/dev/null 2>&1; then
            echo "Could not set package visibility through the API; verifying current state instead."
          fi
          visibility="$(gh api "$base" --jq .visibility 2>/dev/null || echo unknown)"
          if [ "$visibility" != public ]; then
            echo "ERROR: GHCR package $package is '$visibility', not public." >&2
            echo "Add a GHCR_VISIBILITY_TOKEN secret with admin:packages if the repository token cannot change it." >&2
            exit 1
          fi

  smoke:
    name: Smoke test published image
    needs: verify
    # This verifies the product from outside the cluster as a stranger would.
    # A GitHub-hosted runner is correct by design, not an exemption from the
    # lab runner rule for project build and release jobs.
    runs-on: ubuntu-latest
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Pull and start published image without registry credentials
        run: |
          image="ghcr.io/sentania-labs/vcf-mcp:$GITHUB_REF_NAME"
          docker pull "$image"
          docker run --detach \
            --name vcf-mcp-release-smoke \
            --publish 127.0.0.1:18080:8000 \
            "$image"

      - name: Assert health endpoint answers
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs vcf-mcp-release-smoke
          exit 1

  release:
    name: Create GitHub release
    needs: smoke
    runs-on: lab
    if: github.repository == 'sentania-labs/vcf-mcp'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
