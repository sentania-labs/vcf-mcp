name: build-deploy

on:
  push:
    branches: [ "main", "round/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: CI Pipeline
    runs-on: [self-hosted]
    if: github.repository == 'sentania-labs/vcf-ops-mcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) # fork-gated
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Do not enable setup-python's pip cache on this heterogeneous
          # self-hosted pool. Some runners have an unwritable inherited pip
          # cache directory, and setup-python turns that optional accelerator
          # into a hard failure before dependency installation begins.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          python -m pip install -e .[test]

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Tier 1 and 2 Tests
        # These tests include fixture safety/freshness and exact skills-index
        # regeneration checks. The live tier remains explicitly opt-in.
        run: python -m pytest tests/

  build:
    name: Build and Push
    needs: test
    runs-on: [self-hosted]
    if: github.event_name == 'push' && github.repository == 'sentania-labs/vcf-ops-mcp'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/sentania-labs/vcf-ops-mcp:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/main' && github.repository == 'sentania-labs/vcf-ops-mcp'
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.DOCKER_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DOCKER_DEPLOY_HOST }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          missing=()
          [ -n "$DEPLOY_KEY" ] || missing+=("DOCKER_DEPLOY_KEY")
          [ -n "$DEPLOY_HOST" ] || missing+=("DOCKER_DEPLOY_HOST")
          [ -n "$SERVICE_URL" ] || missing+=("SERVICE_URL")
          [ -n "$IMAGE_DIGEST" ] || missing+=("IMAGE_DIGEST")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required deployment configuration: ${missing[*]}" >&2
            exit 1
          fi

      # CI owns images.env, which carries only the pinned image digest. Runtime
      # secrets are generated or consumed on the mounted /keys volume and are
      # never deployment environment values.
      - name: Deploy to slot and verify health
        env:
          DEPLOY_KEY: ${{ secrets.DOCKER_DEPLOY_KEY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOY_HOST: ${{ vars.DOCKER_DEPLOY_HOST }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SLOT: /srv/services/vcf-ops-mcp
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set and nonempty}"
          KEY_PATH="$RUNNER_TEMP/deploy_key"
          IMAGES_ENV_PATH="$RUNNER_TEMP/images.env"
          trap 'rm -f -- "$KEY_PATH" "$IMAGES_ENV_PATH"' EXIT
          install -m 600 /dev/null "$KEY_PATH"
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_PATH"
          printf 'VCF_OPS_MCP_IMAGE=ghcr.io/sentania-labs/vcf-ops-mcp@%s\n' "$IMAGE_DIGEST" > "$IMAGES_ENV_PATH"
          cat "$IMAGES_ENV_PATH"

          COMPOSE="docker compose --project-directory $SLOT --env-file $SLOT/images.env"

          scp -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -O -i "$KEY_PATH" \
            deploy/compose.yml "$DEPLOY_HOST:$SLOT/docker-compose.yml"
          scp -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -O -i "$KEY_PATH" \
            "$IMAGES_ENV_PATH" "$DEPLOY_HOST:$SLOT/images.env"
          # The slot account runs a forced-command wrapper with a verb allowlist
          # (see the lab container host contract). It permits scp -O under the
          # slot directory and `docker compose --project-directory <slot>
          # [--env-file ...] {pull,up -d,down,ps,restart,logs}`, and nothing
          # else: no `cd`, no heredocs, no `test`, no shell metacharacters.
          if ! ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$KEY_PATH" \
            "$DEPLOY_HOST" "$COMPOSE pull"; then
            echo "Compose pull failed for the pinned image." >&2
            exit 1
          fi
          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$KEY_PATH" \
            "$DEPLOY_HOST" "$COMPOSE up -d"
          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$KEY_PATH" \
            "$DEPLOY_HOST" "$COMPOSE ps"

          echo "Waiting for service to become healthy..."
          HEALTHY=0
          for i in {1..12}; do
            if curl -k -f -s "$SERVICE_URL/healthz"; then
              echo "Health check passed!"
              HEALTHY=1
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" -eq 0 ]; then
            echo "Health check failed. Rollback is unavailable until a prior digest can be derived through the slot wrapper."
            exit 1
          fi

          exit 0
