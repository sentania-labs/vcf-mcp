name: Release signed backend packs

on:
  workflow_dispatch:
    inputs:
      prove_oci_round_trip:
        description: Push and verify one throwaway OCI backend-pack artifact
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/vcf_mcp/packs/**"
      - ".github/workflows/release-packs.yml"

permissions:
  contents: read

jobs:
  prove-oci-round-trip:
    name: Prove signed OCI pack round trip
    if: github.event_name == 'workflow_dispatch' && inputs.prove_oci_round_trip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
      expected-sha256: ${{ steps.publish.outputs.expected-sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned OCI tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo "6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  oras.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oci-tools"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oci-tools" oras
          chmod 0755 "$RUNNER_TEMP/oci-tools/oras"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  cosign" | sha256sum --check
          install -m 0755 cosign "$RUNNER_TEMP/oci-tools/cosign"
          echo "$RUNNER_TEMP/oci-tools" >> "$GITHUB_PATH"
      - name: Push and sign throwaway pack artifact
        id: publish
        env:
          GHCR_PASSWORD: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reference="ghcr.io/sentania-labs/vcf-mcp:pack-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_PASSWORD" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push \
            --artifact-type application/vnd.sentania.vcf-mcp.backend-pack.v1+json \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "$reference" \
            src/vcf_mcp/packs/ops.json:application/vnd.sentania.vcf-mcp.backend-pack.v1+json
          digest="$(oras resolve "$reference")"
          cosign sign --yes "${reference}@${digest}"
          {
            echo "reference=$reference"
            echo "digest=$digest"
            echo "expected-sha256=$(sha256sum src/vcf_mcp/packs/ops.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          echo "Published signed non-image OCI artifact: ${reference}@${digest}"

  prove-oci-round-trip-anonymous:
    name: Verify and pull OCI pack anonymously
    needs: prove-oci-round-trip
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install appliance runtime
        shell: bash
        run: python -m pip install --disable-pip-version-check .
      - name: Install pinned OCI tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo "6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  oras.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oci-tools"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oci-tools" oras
          chmod 0755 "$RUNNER_TEMP/oci-tools/oras"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  cosign" | sha256sum --check
          install -m 0755 cosign "$RUNNER_TEMP/oci-tools/cosign"
          curl -fsSLo "$RUNNER_TEMP/oci-tools/trusted_root.json" \
            https://tuf-repo-cdn.sigstore.dev/targets/6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66.trusted_root.json
          echo "6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66  $RUNNER_TEMP/oci-tools/trusted_root.json" | sha256sum --check
          echo "$RUNNER_TEMP/oci-tools" >> "$GITHUB_PATH"
      - name: Pull without credentials and verify pinned workflow identity
        env:
          DIGEST: ${{ needs.prove-oci-round-trip.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker-config
          EXPECTED_SHA256: ${{ needs.prove-oci-round-trip.outputs.expected-sha256 }}
          REFERENCE: ${{ needs.prove-oci-round-trip.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          pinned_identity="https://github.com/sentania-labs/vcf-mcp/.github/workflows/release-packs.yml@refs/heads/${GITHUB_REF_NAME}"
          immutable="${REFERENCE}@${DIGEST}"
          mkdir -p "$DOCKER_CONFIG"
          mkdir anonymous-pull
          oras pull --output anonymous-pull "$immutable"
          actual_sha256="$(sha256sum anonymous-pull/src/vcf_mcp/packs/ops.json | cut -d' ' -f1)"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          cosign verify \
            --certificate-identity "$pinned_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$immutable" | tee cosign-verification.json
          if cosign verify \
            --certificate-identity "${pinned_identity}-wrong" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$immutable" >/dev/null 2>&1; then
            echo "ERROR: verification accepted the wrong certificate identity" >&2
            exit 1
          fi
          echo "Anonymous pull matched SHA-256: $actual_sha256"
          echo "Pinned certificate identity verified: $pinned_identity"
      - name: Exercise the appliance registry path anonymously
        env:
          COSIGN_PATH: ${{ runner.temp }}/oci-tools/cosign
          DIGEST: ${{ needs.prove-oci-round-trip.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker-config
          EXPECTED_SHA256: ${{ needs.prove-oci-round-trip.outputs.expected-sha256 }}
          REFERENCE: ${{ needs.prove-oci-round-trip.outputs.reference }}
          TRUST_ROOT_PATH: ${{ runner.temp }}/oci-tools/trusted_root.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path

          import httpx

          from vcf_mcp.contracts import BackendKind, Capability
          from vcf_mcp.pack_trust import (
              MAX_BUNDLE_BYTES,
              PACK_REGISTRY_TOKEN_URL,
              PackTrustManager,
              _read_registry_bytes,
          )
          from vcf_mcp.runtime_repository import RuntimeRepository


          async def main() -> None:
              reference = os.environ["REFERENCE"]
              digest = os.environ["DIGEST"]
              tag = reference.rsplit(":", 1)[1]
              source = json.loads(Path("src/vcf_mcp/packs/ops.json").read_text())
              identity = (
                  "https://github.com/sentania-labs/vcf-mcp/.github/workflows/"
                  f"release-packs.yml@refs/heads/{os.environ['GITHUB_REF_NAME']}"
              )
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  repository = RuntimeRepository(
                      root / "data" / "config.sqlite3",
                      root / "keys" / "credential_keyring.json",
                      grantable_scopes=frozenset(Capability),
                  )
                  repository.bootstrap()
                  try:
                      manager = PackTrustManager(
                          repository,
                          store_path=root / "packs",
                          trust_root_path=Path(os.environ["TRUST_ROOT_PATH"]),
                          cosign_path=Path(os.environ["COSIGN_PATH"]),
                          temp_path=root / "temp",
                          certificate_identity=identity,
                      )
                      async with httpx.AsyncClient(timeout=30.0) as client:
                          _, token_bytes, _ = await _read_registry_bytes(
                              client,
                              PACK_REGISTRY_TOKEN_URL,
                              max_bytes=MAX_BUNDLE_BYTES,
                              description="registry token response",
                          )
                          token = json.loads(token_bytes)["token"]
                          entry = await manager._registry_entry(
                              client,
                              headers={"Authorization": f"Bearer {token}"},
                              tag=tag,
                              backend=BackendKind(str(source["backend"])),
                              version=str(source["version"]),
                          )
                      if entry["manifest_digest"] != digest:
                          raise RuntimeError("appliance resolved a different manifest")
                      if int(entry["blob_redirects"]) < 1:
                          raise RuntimeError("GHCR blob read did not exercise a redirect")
                      result = await asyncio.to_thread(
                          manager._install_from_registry_sync,
                          str(entry["reference"]),
                          str(entry["manifest_digest"]),
                          BackendKind(str(entry["backend"])),
                          str(entry["version"]),
                      )
                      staged = manager.staged_path / f"{result.backend}.json"
                      actual_sha256 = hashlib.sha256(staged.read_bytes()).hexdigest()
                      if actual_sha256 != os.environ["EXPECTED_SHA256"]:
                          raise RuntimeError("appliance staged different pack bytes")
                      print(
                          "Appliance GHCR path verified: "
                          f"redirects={entry['blob_redirects']} "
                          f"digest={entry['manifest_digest']} "
                          f"sha256={actual_sha256} identity={identity}"
                      )
                  finally:
                      repository.close()


          asyncio.run(main())
          PY

  sign:
    name: Publish signed OCI backend packs
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.prove_oci_round_trip) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      legacy-feed: ${{ steps.legacy.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned OCI tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo "6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  oras.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oci-tools"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oci-tools" oras
          chmod 0755 "$RUNNER_TEMP/oci-tools/oras"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  cosign" | sha256sum --check
          install -m 0755 cosign "$RUNNER_TEMP/oci-tools/cosign"
          echo "$RUNNER_TEMP/oci-tools" >> "$GITHUB_PATH"
      - name: Push immutable pack versions and sign their manifest digests
        id: publish
        env:
          GHCR_PASSWORD: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PASSWORD" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          : > published.tsv
          for pack in src/vcf_mcp/packs/*.json; do
            backend="$(jq -r .backend "$pack")"
            version="$(jq -r .version "$pack")"
            [[ "$backend" =~ ^[a-z0-9-]+$ ]]
            [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]
            reference="ghcr.io/sentania-labs/vcf-mcp:pack-${backend}-${version}"
            expected_sha256="$(sha256sum "$pack" | cut -d' ' -f1)"
            if digest="$(oras resolve "$reference" 2>/dev/null)"; then
              pull_dir="$(mktemp -d)"
              oras pull --output "$pull_dir" "${reference}@${digest}"
              actual_sha256="$(sha256sum "$pull_dir/$pack" | cut -d' ' -f1)"
              test "$actual_sha256" = "$expected_sha256"
              if ! cosign verify \
                --certificate-identity https://github.com/sentania-labs/vcf-mcp/.github/workflows/release-packs.yml@refs/heads/main \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "${reference}@${digest}" >/dev/null 2>&1; then
                cosign sign --yes "${reference}@${digest}"
                cosign verify \
                  --certificate-identity https://github.com/sentania-labs/vcf-mcp/.github/workflows/release-packs.yml@refs/heads/main \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "${reference}@${digest}" >/dev/null
              fi
            else
              oras push \
                --artifact-type application/vnd.sentania.vcf-mcp.backend-pack.v1+json \
                --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                "$reference" \
                "$pack":application/vnd.sentania.vcf-mcp.backend-pack.v1+json
              digest="$(oras resolve "$reference")"
              cosign sign --yes "${reference}@${digest}"
            fi
            printf '%s\t%s\t%s\t%s\n' "$reference" "$digest" "$expected_sha256" "$pack" >> published.tsv
          done
          echo "published=$(base64 -w0 published.tsv)" >> "$GITHUB_OUTPUT"
      - name: Build v0.3.0 legacy release feed
        id: legacy
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$project_version" != "0.3.0" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          mkdir signed-packs
          for pack in src/vcf_mcp/packs/*.json; do
            name="$(basename "$pack")"
            cp "$pack" "signed-packs/$name"
            cosign sign-blob --yes --bundle "signed-packs/${name%.json}.sigstore.json" "$pack"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          base = "https://github.com/sentania-labs/vcf-mcp/releases/download/backend-packs"
          entries = []
          for path in sorted(Path("signed-packs").glob("*.json")):
              if path.name.endswith(".sigstore.json"):
                  continue
              pack = json.loads(path.read_text())
              entries.append(
                  {
                      "id": f"{pack['backend']}:{pack['version']}",
                      "backend": pack["backend"],
                      "version": pack["version"],
                      "tool_count": len(pack["tools"]),
                      "estimated_definition_tokens": max(
                          1,
                          sum(
                              len(tool["name"])
                              + len(tool["summary"])
                              + 32 * len(tool.get("arguments", []))
                              for tool in pack["tools"]
                          )
                          // 4,
                      ),
                      "pack_url": f"{base}/{path.name}",
                      "bundle_url": f"{base}/{path.stem}.sigstore.json",
                  }
              )
          Path("signed-packs/feed.json").write_text(
              json.dumps({"packs": entries}, indent=2) + "\n"
          )
          PY
      - name: Publish final legacy signed-pack feed for v0.3.0
        if: steps.legacy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view backend-packs >/dev/null 2>&1; then
            gh release create backend-packs --target main --title "Backend packs" --notes "Signed backend-pack distribution feed."
          fi
          gh release upload backend-packs signed-packs/* --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.legacy.outputs.enabled == 'true'
        with:
          name: legacy-signed-backend-packs-v0.3.0
          path: signed-packs/
          if-no-files-found: error

  verify-published-packs:
    name: Verify public signed backend packs
    needs: sign
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install pinned OCI tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo "6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  oras.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oci-tools"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oci-tools" oras
          chmod 0755 "$RUNNER_TEMP/oci-tools/oras"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  cosign" | sha256sum --check
          install -m 0755 cosign "$RUNNER_TEMP/oci-tools/cosign"
          echo "$RUNNER_TEMP/oci-tools" >> "$GITHUB_PATH"
      - name: Pull and verify every pack without registry credentials
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker-config
          PUBLISHED: ${{ needs.sign.outputs.published }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          echo "$PUBLISHED" | base64 --decode > published.tsv
          while IFS=$'\t' read -r reference digest expected_sha256 source_path; do
            pull_dir="$(mktemp -d)"
            oras pull --output "$pull_dir" "${reference}@${digest}"
            actual_sha256="$(sha256sum "$pull_dir/$source_path" | cut -d' ' -f1)"
            test "$actual_sha256" = "$expected_sha256"
            cosign verify \
              --certificate-identity https://github.com/sentania-labs/vcf-mcp/.github/workflows/release-packs.yml@refs/heads/main \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}@${digest}"
            echo "Anonymous pull and pinned identity verified: ${reference}@${digest}"
          done < published.tsv
