[project]
name = "vcf-mcp"
version = "0.3.0"
description = "Sentania multi-backend VCF MCP prototype (unofficial)"
requires-python = ">=3.12"
dependencies = [
    # Capped below 2.0: mcp 2.x removed mcp.server.fastmcp, the framework
    # decision 002 selected. Raising the cap is a framework migration.
    "mcp>=1.2.0,<2",
    "starlette",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "cryptography",
    "httpx",
    "itsdangerous",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcf_mcp"]
