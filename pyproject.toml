[project]
name = "vcf-ops-mcp"
version = "0.1.0"
description = "Sentania VCF Ops MCP (unofficial)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "starlette",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "cryptography",
    "httpx",
    "itsdangerous",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
