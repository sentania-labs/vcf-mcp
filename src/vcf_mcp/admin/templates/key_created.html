{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>API key created</h1>
  <p class="notice">Copy this value now. Only its SHA-256 digest is stored, so it cannot be shown again.</p>
  <p class="secret">{{ presented_key }}</p>
  <p><a href="/admin?tab=api-keys">Return to API keys</a></p>
</section>
{% endblock %}
